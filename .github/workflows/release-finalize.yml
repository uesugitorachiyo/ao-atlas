name: Governed release finalizer

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Successful release-rehearsal workflow run ID
        required: true
        type: string
      expected_source_sha:
        description: Exact candidate source commit
        required: true
        type: string
      expected_version:
        description: Exact candidate version
        required: true
        type: string
      expected_tag:
        description: Exact candidate tag
        required: true
        type: string
      expected_manifest_digest:
        description: Exact approved manifest digest
        required: true
        type: string
      expected_plan_digest:
        description: Exact promotion-plan.json SHA-256
        required: true
        type: string
      dry_run:
        description: Validate without public mutation
        required: true
        default: true
        type: boolean
      live_confirmation:
        description: Exact live publication confirmation; unused by dry runs
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-imported-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Authenticate finalizer source before checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"

      - name: Check out the exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate producer run and artifact inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          VERSION: ${{ inputs.expected_version }}
          TAG: ${{ inputs.expected_tag }}
          MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
          PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          LIVE_CONFIRMATION: ${{ inputs.live_confirmation }}
        run: |
          set -euo pipefail

          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LIVE_CONFIRMATION" =~ ^[A-Za-z0-9:._-]{0,512}$ ]]
          test "$TAG" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID" > producer-run.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            '.id | tostring == $run_id' producer-run.json >/dev/null
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            '.repository.full_name == $repository and
             .path == ".github/workflows/release-rehearsal.yml" and
             .event == "workflow_dispatch" and
             .conclusion == "success" and
             .head_sha == $source_sha' producer-run.json >/dev/null

          created_epoch=$(date -u -d "$(jq -er '.created_at' producer-run.json)" +%s)
          now_epoch=$(date -u +%s)
          age_seconds=$((now_epoch - created_epoch))
          (( age_seconds >= 0 && age_seconds <= 14 * 24 * 60 * 60 ))

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100" > producer-artifacts.json
          jq -e \
            '.total_count == 5 and
             ([.artifacts[].name] | unique | length) == 5 and
             ([.artifacts[].id] | unique | length) == 5 and
             all(.artifacts[]; .expired == false and (.size_in_bytes | type) == "number" and .size_in_bytes >= 0) and
             (.artifacts | map(.size_in_bytes) | add <= 128 * 1024 * 1024)' \
            producer-artifacts.json >/dev/null
          jq -r '.artifacts[].name' producer-artifacts.json | LC_ALL=C sort > actual-artifacts.txt
          printf '%s\n' \
            "ao-atlas-release-input-binding-$SOURCE_SHA" \
            "ao-atlas-release-candidate-linux-x86_64-$SOURCE_SHA" \
            "ao-atlas-release-candidate-macos-aarch64-$SOURCE_SHA" \
            "ao-atlas-release-candidate-windows-x86_64-$SOURCE_SHA" \
            "ao-atlas-release-rehearsal-plan-$SOURCE_SHA" \
            | LC_ALL=C sort > expected-artifacts.txt
          cmp actual-artifacts.txt expected-artifacts.txt

          mkdir artifact-zips
          jq -r '.artifacts[] | [.id, .name] | @tsv' producer-artifacts.json |
            while IFS=$'\t' read -r artifact_id artifact_name; do
              [[ "$artifact_id" =~ ^[1-9][0-9]{0,19}$ ]]
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "artifact-zips/$artifact_name.zip"
            done
          compressed_bytes=$(find artifact-zips -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
          (( compressed_bytes <= 128 * 1024 * 1024 ))
          python3 scripts/inspect-release-artifact-zips.py \
            --max-entries 128 \
            --max-expanded-bytes 134217728 \
            artifact-zips/*.zip

      - name: Download exact producer artifacts
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          pattern: ao-atlas-release-*-${{ inputs.expected_source_sha }}
          path: imported-release
          merge-multiple: false

      - name: Revalidate imported bytes and stage exact public inventory
        shell: bash
        env:
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          VERSION: ${{ inputs.expected_version }}
          TAG: ${{ inputs.expected_tag }}
          MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
          PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
        run: |
          set -euo pipefail

          expected_identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID"
          test -d imported-release
          test -z "$(find imported-release -type l -print -quit)"
          test -z "$(find imported-release -mindepth 1 ! -type f ! -type d -print -quit)"
          file_count=$(find imported-release -type f -print | wc -l)
          total_bytes=$(find imported-release -type f -printf '%s\n' | awk '{total += $1} END {print total + 0}')
          (( file_count <= 128 ))
          (( total_bytes <= 128 * 1024 * 1024 ))

          release_notes_sha256=$(git cat-file blob "${SOURCE_SHA}:docs/release/${VERSION}.md" | sha256sum | awk '{print $1}')
          binding_dir="imported-release/ao-atlas-release-input-binding-${SOURCE_SHA}"
          test -d "$binding_dir"
          test -z "$(find "$binding_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find "$binding_dir" -mindepth 2 -print -quit)"
          test "$(find "$binding_dir" -maxdepth 1 -type f | wc -l)" -eq 2
          test -f "$binding_dir/release-input-binding.json"
          test -f "$binding_dir/release-input-binding.sha256"
          (cd "$binding_dir" && sha256sum --check --strict release-input-binding.sha256)
          python3 scripts/validate-strict-json.py "$binding_dir/release-input-binding.json"
          jq -e \
            --arg manifest "$MANIFEST_DIGEST" \
            --arg notes_digest "sha256:$release_notes_sha256" \
            --arg run_id "$PRODUCER_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            '.schema_version == "ao.atlas.release-rehearsal-input-binding.v0.2" and
             .dry_run == true and .immutable == true and
             .approved_manifest_digest == $manifest and
             .release_notes_path == ("docs/release/" + $version + ".md") and
             .release_notes_sha256 == $notes_digest and
             .source_sha == $source_sha and .tag == $tag and .version == $version and
             .workflow_run_id == $run_id' \
            "$binding_dir/release-input-binding.json" >/dev/null

          targets=(linux-x86_64 macos-aarch64 windows-x86_64)
          for target in "${targets[@]}"; do
            candidate_dir="imported-release/ao-atlas-release-candidate-${target}-${SOURCE_SHA}"
            test -d "$candidate_dir"
            test -z "$(find "$candidate_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
            test -z "$(find "$candidate_dir" -mindepth 2 -print -quit)"
            (cd "$candidate_dir" && sha256sum --check --strict SHA256SUMS)
            python3 scripts/validate-strict-json.py "$candidate_dir"/*.json
            test "$(jq -er '.workflow_identity' "$candidate_dir/candidate-summary.json")" = "$expected_identity"
          done

          plan_dir="imported-release/ao-atlas-release-rehearsal-plan-${SOURCE_SHA}"
          test -d "$plan_dir"
          test -z "$(find "$plan_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find "$plan_dir" -mindepth 2 -print -quit)"
          test "$(find "$plan_dir" -maxdepth 1 -type f | wc -l)" -eq 3
          test -f "$plan_dir/promotion-plan.json"
          test -f "$plan_dir/promotion-plan.sha256"
          test -f "$plan_dir/dry-run-boundary.json"
          (cd "$plan_dir" && sha256sum --check --strict promotion-plan.sha256)
          test "$(sha256sum "$plan_dir/promotion-plan.json" | awk '{print $1}')" = "$PLAN_DIGEST"
          python3 scripts/validate-strict-json.py "$plan_dir"/*.json
          jq -e \
            '.dry_run == true and
             .publication_attempted == false and .tag_creation_attempted == false and
             .release_creation_attempted == false and .public_upload_attempted == false' \
            "$plan_dir/dry-run-boundary.json" >/dev/null

          bash scripts/verify-release-rehearsal-candidates.sh \
            --candidates-dir imported-release \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --approved-manifest-digest "$MANIFEST_DIGEST" \
            --release-notes-sha256 "sha256:$release_notes_sha256" \
            --plan-out recomputed-promotion-plan.json
          python3 scripts/validate-strict-json.py recomputed-promotion-plan.json
          cmp recomputed-promotion-plan.json "$plan_dir/promotion-plan.json"
          jq -e \
            --arg manifest "$MANIFEST_DIGEST" \
            --arg notes_digest "sha256:$release_notes_sha256" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            '.approved_manifest_digest == $manifest and
             .release_notes_sha256 == $notes_digest and
             .source_sha == $source_sha and .tag == $tag and .version == $version' \
            recomputed-promotion-plan.json >/dev/null

          mkdir validated-release
          cp --no-clobber "$plan_dir/promotion-plan.json" validated-release/promotion-plan.json
          (cd validated-release && sha256sum promotion-plan.json > promotion-plan.sha256)
          for target in "${targets[@]}"; do
            candidate_dir="imported-release/ao-atlas-release-candidate-${target}-${SOURCE_SHA}"
            archive=$(jq -er --arg target "$target" 'select(.target_label == $target) | .archive' "$candidate_dir/candidate-summary.json")
            cp --no-clobber "$candidate_dir/$archive" "validated-release/$archive"
            cp --no-clobber "$candidate_dir/provenance.json" "validated-release/${target}-provenance.json"
            cp --no-clobber "$candidate_dir/sbom.spdx.json" "validated-release/${target}-sbom.spdx.json"
            cp --no-clobber "$candidate_dir/signature-verification.json" "validated-release/${target}-signature-verification.json"
          done
          (
            cd validated-release
            sha256sum ao-atlas-*.tar.gz | LC_ALL=C sort > SHA256SUMS
            test "$(find . -maxdepth 1 -type f | wc -l)" -eq 15
          )

      - name: Upload one validated import
        uses: actions/upload-artifact@v7
        with:
          name: ao-atlas-validated-release-import-${{ inputs.producer_run_id }}
          path: validated-release
          if-no-files-found: error
          overwrite: false

  dry-run-boundary:
    needs: validate-imported-release
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Record zero-mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -cn '{schema_version:"ao.atlas.release-finalize-dry-run-boundary.v0.1",dry_run:true,publication_attempted:false,tag_creation_attempted:false,release_creation_attempted:false,public_upload_attempted:false,deployment_attempted:false,provider_credentials_used:false,permission_mutation_attempted:false,environment_mutation_attempted:false}' > dry-run-boundary.json
      - name: Upload dry-run boundary
        uses: actions/upload-artifact@v7
        with:
          name: ao-atlas-release-finalize-dry-run-boundary-${{ inputs.producer_run_id }}
          path: dry-run-boundary.json
          if-no-files-found: error
          overwrite: false

  publish-release:
    needs: validate-imported-release
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: protected-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the validated import
        uses: actions/download-artifact@v7
        with:
          name: ao-atlas-validated-release-import-${{ inputs.producer_run_id }}
          path: validated-release

      - name: Publish the exact validated inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_CONFIRMATION: ${{ inputs.live_confirmation }}
          MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
          PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          PROTECTED_RELEASE_SENTINEL_SECRET: ${{ secrets.AO_ATLAS_PROTECTED_RELEASE_SENTINEL }}
          PROTECTED_RELEASE_SENTINEL_VARIABLE: ${{ vars.AO_ATLAS_PROTECTED_RELEASE_SENTINEL }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TAG: ${{ inputs.expected_tag }}
          VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail

          test "$TAG" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$PROTECTED_RELEASE_SENTINEL_SECRET"
          test "$PROTECTED_RELEASE_SENTINEL_VARIABLE" = "protected-release-required-reviewers-configured"
          test "$PROTECTED_RELEASE_SENTINEL_SECRET" = "$PROTECTED_RELEASE_SENTINEL_VARIABLE"
          expected_confirmation="publish-imported-ao-atlas-${PRODUCER_RUN_ID}-${VERSION}-${TAG}-${SOURCE_SHA}-${MANIFEST_DIGEST}-${PLAN_DIGEST}"
          test "$LIVE_CONFIRMATION" = "$expected_confirmation"

          test -d validated-release
          test -z "$(find validated-release -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find validated-release -mindepth 2 -print -quit)"
          test "$(find validated-release -maxdepth 1 -type f | wc -l)" -eq 15
          find validated-release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > actual-assets.txt
          printf '%s\n' \
            "ao-atlas-${VERSION}-linux-x86_64.tar.gz" \
            "ao-atlas-${VERSION}-macos-aarch64.tar.gz" \
            "ao-atlas-${VERSION}-windows-x86_64.tar.gz" \
            "linux-x86_64-provenance.json" \
            "linux-x86_64-sbom.spdx.json" \
            "linux-x86_64-signature-verification.json" \
            "macos-aarch64-provenance.json" \
            "macos-aarch64-sbom.spdx.json" \
            "macos-aarch64-signature-verification.json" \
            "promotion-plan.json" \
            "promotion-plan.sha256" \
            "SHA256SUMS" \
            "windows-x86_64-provenance.json" \
            "windows-x86_64-sbom.spdx.json" \
            "windows-x86_64-signature-verification.json" \
            | LC_ALL=C sort > expected-assets.txt
          cmp actual-assets.txt expected-assets.txt
          (
            cd validated-release
            printf '%s\n' \
              "ao-atlas-${VERSION}-linux-x86_64.tar.gz" \
              "ao-atlas-${VERSION}-macos-aarch64.tar.gz" \
              "ao-atlas-${VERSION}-windows-x86_64.tar.gz" \
              | LC_ALL=C sort > ../expected-archive-checks.txt
            awk '{print $2}' SHA256SUMS | LC_ALL=C sort > ../actual-archive-checks.txt
            cmp ../actual-archive-checks.txt ../expected-archive-checks.txt
            sha256sum --check --strict SHA256SUMS
            sha256sum --check --strict promotion-plan.sha256
            test "$(sha256sum promotion-plan.json | awk '{print $1}')" = "$PLAN_DIGEST"
          )

          if gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag-ref-preflight.txt; then
            echo "ref refs/tags/$TAG already exists" >&2
            exit 1
          fi
          grep -Eq '^HTTP/[^ ]+ 404 ' tag-ref-preflight.txt
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release-preflight.txt; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          grep -Eq '^HTTP/[^ ]+ 404 ' release-preflight.txt

          gh api \
            --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SOURCE_SHA" \
            > created-ref.json
          jq -e \
            --arg ref "refs/tags/$TAG" \
            --arg source_sha "$SOURCE_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $source_sha' \
            created-ref.json >/dev/null
          gh release create "$TAG" \
            --verify-tag \
            --target "$SOURCE_SHA" \
            --title "$VERSION" \
            --notes-file "docs/release/${VERSION}.md" \
            validated-release/*

  verify-public-release:
    needs: publish-release
    if: ${{ needs.publish-release.result == 'success' }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux-x86_64
            binary: ao-atlas
          - os: macos-15
            target_label: macos-aarch64
            binary: ao-atlas
          - os: windows-latest
            target_label: windows-x86_64
            binary: ao-atlas.exe
    steps:
      - name: Check out the exact public fixture source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify public release and installed archive
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
          PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TAG: ${{ inputs.expected_tag }}
          TARGET_LABEL: ${{ matrix.target_label }}
          VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail

          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          test "$TAG" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          committed_release_notes="$RUNNER_TEMP/ao-atlas-release-notes-${TARGET_LABEL}.md"
          git cat-file blob "${SOURCE_SHA}:docs/release/${VERSION}.md" > "$committed_release_notes"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > public-tag-ref.json
          jq -e \
            --arg ref "refs/tags/$TAG" \
            --arg source_sha "$SOURCE_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $source_sha' \
            public-tag-ref.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > public-release.json
          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            '.tag_name == $tag and .target_commitish == $source_sha and
             .name == $version and (.body | type) == "string" and
             .draft == false and .prerelease == false and
             (.assets | length) == 15 and
             ([.assets[].name] | unique | length) == 15 and
             all(.assets[]; .state == "uploaded" and (.size | type) == "number" and .size > 0)' \
            public-release.json >/dev/null
          jq --binary -j '.body' public-release.json > public-release-body.txt
          cmp public-release-body.txt "$committed_release_notes"
          jq -r '.assets[].name' public-release.json | LC_ALL=C sort > actual-assets.txt
          printf '%s\n' \
            "ao-atlas-${VERSION}-linux-x86_64.tar.gz" \
            "ao-atlas-${VERSION}-macos-aarch64.tar.gz" \
            "ao-atlas-${VERSION}-windows-x86_64.tar.gz" \
            "linux-x86_64-provenance.json" \
            "linux-x86_64-sbom.spdx.json" \
            "linux-x86_64-signature-verification.json" \
            "macos-aarch64-provenance.json" \
            "macos-aarch64-sbom.spdx.json" \
            "macos-aarch64-signature-verification.json" \
            "promotion-plan.json" \
            "promotion-plan.sha256" \
            "SHA256SUMS" \
            "windows-x86_64-provenance.json" \
            "windows-x86_64-sbom.spdx.json" \
            "windows-x86_64-signature-verification.json" \
            | LC_ALL=C sort > expected-assets.txt
          cmp actual-assets.txt expected-assets.txt

          mkdir release-assets
          gh release download "$TAG" --dir release-assets
          test -z "$(find release-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find release-assets -mindepth 2 -print -quit)"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 15
          find release-assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > downloaded-assets.txt
          cmp downloaded-assets.txt expected-assets.txt

          release_notes_sha256=$(hash_file "$committed_release_notes")
          test "$(hash_file release-assets/promotion-plan.json)" = "$PLAN_DIGEST"
          jq -e \
            --arg manifest "$MANIFEST_DIGEST" \
            --arg notes_digest "sha256:$release_notes_sha256" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            '.schema_version == "ao.atlas.release-rehearsal-promotion-plan.v0.5" and
             .status == "dry_run_plan_ready" and .immutable == true and
             .approved_manifest_digest == $manifest and
             .source_sha == $source_sha and .tag == $tag and .version == $version and
             .release_notes_sha256 == $notes_digest and
             (.candidates | length) == 3 and
             ([.candidates[].target_label] | sort) == ["linux-x86_64", "macos-aarch64", "windows-x86_64"] and
             all(.candidates[];
               .approved_manifest_digest == $manifest and
               .source_sha == $source_sha and .tag == $tag and .version == $version and
               .archive == ("ao-atlas-" + $version + "-" + .target_label + ".tar.gz") and
               .provenance == "provenance.json" and .sbom == "sbom.spdx.json" and
               .signature_verification == "signature-verification.json" and
               (.archive_sha256 | test("^sha256:[0-9a-f]{64}$")) and
               (.provenance_sha256 | test("^sha256:[0-9a-f]{64}$")) and
               (.sbom_sha256 | test("^sha256:[0-9a-f]{64}$")) and
               (.signature_verification_sha256 | test("^sha256:[0-9a-f]{64}$")))' \
            release-assets/promotion-plan.json >/dev/null
          jq -er '
            .candidates[] |
            [
              [.target_label, .archive, .archive_sha256],
              [.target_label, (.target_label + "-provenance.json"), .provenance_sha256],
              [.target_label, (.target_label + "-sbom.spdx.json"), .sbom_sha256],
              [.target_label, (.target_label + "-signature-verification.json"), .signature_verification_sha256]
            ][] | @tsv' \
            release-assets/promotion-plan.json > plan-assets.tsv
          test "$(wc -l < plan-assets.tsv)" -eq 12
          while IFS=$'\t' read -r target asset expected_digest; do
            test -n "$target"
            actual_digest=$(hash_file "release-assets/$asset")
            test "sha256:$actual_digest" = "$expected_digest"
          done < plan-assets.tsv

          (
            cd release-assets
            printf '%s\n' \
              "ao-atlas-${VERSION}-linux-x86_64.tar.gz" \
              "ao-atlas-${VERSION}-macos-aarch64.tar.gz" \
              "ao-atlas-${VERSION}-windows-x86_64.tar.gz" \
              | LC_ALL=C sort > ../expected-archive-checks.txt
            awk '{print $2}' SHA256SUMS | LC_ALL=C sort > ../actual-archive-checks.txt
            cmp ../actual-archive-checks.txt ../expected-archive-checks.txt
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check --strict SHA256SUMS
              sha256sum --check --strict promotion-plan.sha256
            else
              shasum -a 256 --check SHA256SUMS
              shasum -a 256 --check promotion-plan.sha256
            fi
          )

          archive="release-assets/ao-atlas-${VERSION}-${TARGET_LABEL}.tar.gz"
          install_dir="$RUNNER_TEMP/ao-atlas-public-${TARGET_LABEL}"
          mkdir "$install_dir"
          ARCHIVE="$archive" INSTALL_DIR="$install_dir" python3 - <<'PY'
          import os
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = os.environ["ARCHIVE"]
          binary = os.environ["BINARY"]
          destination = Path(os.environ["INSTALL_DIR"])
          expected = {binary, "LICENSE"}
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              seen = set()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or "\\" in member.name:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isfile():
                      raise SystemExit(f"non-regular archive entry: {member.name}")
                  if member.name in seen:
                      raise SystemExit(f"duplicate archive entry: {member.name}")
                  seen.add(member.name)
              if seen != expected:
                  raise SystemExit(f"unexpected archive inventory: {sorted(seen)}")
              for member in members:
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read archive entry: {member.name}")
                  output = destination / member.name
                  with source, output.open("xb") as target:
                      shutil.copyfileobj(source, target)
                  os.chmod(output, member.mode & 0o777)
          PY

          expected_version_identity="ao-atlas version=$VERSION source_sha=$SOURCE_SHA"
          actual_version_identity=$("$install_dir/$BINARY" --version)
          test "$actual_version_identity" = "$expected_version_identity"
          "$install_dir/$BINARY" workgraph validate --workgraph examples/valid/workgraph.json
          jq -cn \
            --arg manifest_digest "$MANIFEST_DIGEST" \
            --arg plan_digest "$PLAN_DIGEST" \
            --arg release_url "$(jq -er '.html_url' public-release.json)" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "$TAG" \
            --arg target_label "$TARGET_LABEL" \
            --arg version_identity "$actual_version_identity" \
            '{schema_version:"ao.atlas.public-release-verification.v0.1",status:"passed",tag:$tag,source_sha:$source_sha,target_label:$target_label,expected_manifest_digest:$manifest_digest,expected_plan_digest:$plan_digest,release_url:$release_url,aggregate_checksums_verified:true,archive_inventory_verified:true,authorized_plan_verified:true,authorized_asset_digests_verified:true,release_metadata_verified:true,version_identity:$version_identity,provider_free_workgraph_validated:true,provider_credentials_used:false}' \
            > "public-release-verification-${TARGET_LABEL}.json"

      - name: Upload target-qualified public verification
        uses: actions/upload-artifact@v7
        with:
          name: ao-atlas-public-release-verification-${{ inputs.expected_tag }}-${{ matrix.target_label }}
          path: public-release-verification-${{ matrix.target_label }}.json
          if-no-files-found: error
          overwrite: false

  consolidate-public-release-verification:
    needs: verify-public-release
    if: ${{ needs.verify-public-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download target-qualified public verification
        uses: actions/download-artifact@v7
        with:
          pattern: ao-atlas-public-release-verification-${{ inputs.expected_tag }}-*
          path: public-release-verification
          merge-multiple: true

      - name: Validate public verification inventory
        shell: bash
        env:
          MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
          PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TAG: ${{ inputs.expected_tag }}
          VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test -z "$(find public-release-verification -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          test -z "$(find public-release-verification -mindepth 2 -print -quit)"
          test "$(find public-release-verification -maxdepth 1 -type f | wc -l)" -eq 3
          find public-release-verification -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > actual-verification-files.txt
          printf '%s\n' \
            public-release-verification-linux-x86_64.json \
            public-release-verification-macos-aarch64.json \
            public-release-verification-windows-x86_64.json \
            > expected-verification-files.txt
          cmp actual-verification-files.txt expected-verification-files.txt
          expected_version_identity="ao-atlas version=$VERSION source_sha=$SOURCE_SHA"
          jq -e -s \
            --arg expected_version_identity "$expected_version_identity" \
            --arg manifest "$MANIFEST_DIGEST" \
            --arg plan_digest "$PLAN_DIGEST" \
            --arg source_sha "$SOURCE_SHA" \
            --arg tag "$TAG" \
            'length == 3 and
             ([.[].target_label] | unique) == ["linux-x86_64", "macos-aarch64", "windows-x86_64"] and
             all(.[]; .schema_version == "ao.atlas.public-release-verification.v0.1" and
                      .status == "passed" and .tag == $tag and .source_sha == $source_sha and
                      .expected_manifest_digest == $manifest and .expected_plan_digest == $plan_digest and
                      .version_identity == $expected_version_identity and
                      .aggregate_checksums_verified == true and .archive_inventory_verified == true and
                      .authorized_plan_verified == true and .authorized_asset_digests_verified == true and
                      .release_metadata_verified == true and .provider_free_workgraph_validated == true and
                      .provider_credentials_used == false)' \
            public-release-verification/*.json >/dev/null

      - name: Upload public release verification
        uses: actions/upload-artifact@v7
        with:
          name: ao-atlas-public-release-verification-${{ inputs.expected_tag }}
          path: public-release-verification
          if-no-files-found: error
          overwrite: false
